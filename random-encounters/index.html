				color: #e0e0e0;
				padding: 20px;
				min-height: 100vh;
			}

			h1 {
				text-align: center;
				font-size: 1.8rem;
				margin-bottom: 8px;
				color: #f5c542;
				text-shadow: 0 0 10px rgba(245, 197, 66, 0.3);
			}

			.subtitle {
				text-align: center;
				color: #aaa;
				margin-bottom: 30px;
				font-size: 0.9rem;
			}

			.roll-section {
				text-align: center;
				margin-bottom: 40px;
			}

			.roll-btn {
				background: linear-gradient(135deg, #f5c542, #d4a017);
				color: #1a1a2e;
				border: none;
				padding: 16px 40px;
				font-size: 1.3rem;
				font-weight: bold;
				border-radius: 8px;
				cursor: pointer;
				transition:
					transform 0.1s,
					box-shadow 0.2s;
				box-shadow: 0 4px 15px rgba(245, 197, 66, 0.3);
			}

			.roll-btn:hover {
				transform: scale(1.05);
				box-shadow: 0 6px 20px rgba(245, 197, 66, 0.5);
			}
			.roll-btn:active {
				transform: scale(0.95);
			}

			.result-card {
				max-width: 700px;
				margin: 20px auto;
				padding: 20px;
				border-radius: 10px;
				background: #16213e;
				border: 2px solid #f5c542;
				display: none;
			}

			.result-card.show {
				display: block;
				animation: fadeIn 0.3s ease;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(-10px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			.result-roll {
				font-size: 2rem;
				font-weight: bold;
				color: #f5c542;
				text-align: center;
			}
			.result-encounter {
				font-size: 1.2rem;
				font-weight: bold;
				margin: 10px 0;
				text-align: center;
			}
			.result-desc {
				color: #bbb;
				text-align: center;
				font-style: italic;
				margin-bottom: 15px;
			}
			.result-meta {
				display: flex;
				justify-content: center;
				gap: 20px;
				flex-wrap: wrap;
				margin-bottom: 20px;
			}
			.result-meta span {
				font-size: 0.85rem;
			}

			/* Statblock styling */
			.statblock-container {
				display: flex;
				flex-wrap: wrap;
				gap: 20px;
				justify-content: center;
				margin-top: 20px;
			}

			.statblock {
				background: #fdf1dc;
				color: #333;
				border: 2px solid #922610;
				border-radius: 0;
				padding: 15px 20px;
				max-width: 420px;
				width: 100%;
				font-family: "Noto Serif", "Times New Roman", serif;
				font-size: 0.82rem;
				line-height: 1.4;
				box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
			}

			.statblock .name {
				font-size: 1.3rem;
				font-weight: bold;
				color: #922610;
				margin-bottom: 2px;
				font-family: "Libre Baskerville", "Georgia", serif;
			}

			.statblock .type-line {
				font-style: italic;
				color: #555;
				margin-bottom: 8px;
				font-size: 0.8rem;
			}

			.statblock .separator {
				background: linear-gradient(to right, #922610, #c9612e, #922610);
				height: 3px;
				margin: 8px 0;
				border: none;
			}

			.statblock .stat-row {
				display: flex;
				justify-content: space-between;
				margin: 4px 0;
			}

			.statblock .stat-row .label {
				color: #922610;
				font-weight: bold;
			}

			.statblock .abilities {
				display: grid;
				grid-template-columns: repeat(6, 1fr);
				text-align: center;
				margin: 8px 0;
				gap: 4px;
			}

			.statblock .abilities .ab-label {
				font-weight: bold;
				color: #922610;
				font-size: 0.75rem;
			}
			.statblock .abilities .ab-val {
				font-size: 0.8rem;
			}

			.statblock .section-title {

				color: #922610;
				font-size: 0.85rem;
				margin-top: 8px;
				margin-bottom: 4px;
				border-bottom: 1px solid #922610;
				padding-bottom: 2px;
			}

			.statblock .trait {
				margin-bottom: 6px;
			}
			.statblock .trait .trait-name {
				font-weight: bold;
				font-style: italic;
			}
			.statblock .trait .trait-text {
			}

			.statblock .cr-line {
				margin-top: 4px;
			}

				max-width: 1100px;

			}

				margin-bottom: 15px;
				font-size: 1.3rem;
			}

			table {

				border-collapse: collapse;
				font-size: 0.82rem;
			}

			thead {
				position: sticky;
				top: 0;
				z-index: 10;
			}

				color: #f5c542;
				padding: 10px 6px;
				text-align: left;
				border-bottom: 2px solid #f5c542;
			}

			td {

				border-bottom: 1px solid #2a2a4a;
				vertical-align: top;
			}

			tr:hover {
				background: #1f3a5f;
				cursor: pointer;
			}

			tr.selected {
				background: #2a3f6f;
				outline: 1px solid #f5c542;
			}

			tr.easy td:first-child {
				border-left: 3px solid #4caf50;
			}
			tr.medium td:first-child {
				border-left: 3px solid #ff9800;
			}
			tr.hard td:first-child {
				border-left: 3px solid #f44336;
			}
			tr.deadly td:first-child {
				border-left: 3px solid #9c27b0;
			}

				border-radius: 4px;
				font-size: 0.7rem;
				font-weight: bold;
			}

			.tag-beast {
				background: #1b5e20;
				color: #a5d6a7;
			}
			.tag-monstrosity {
				background: #4a148c;
				color: #ce93d8;
			}
			.tag-humanoid {

				color: #ef9a9a;

			.tag-easy {

				color: #a5d6a7;

			.tag-deadly {

			.diff-medium {

			.diff-deadly {

				justify-content: center;
				margin-bottom: 20px;

			function formatMod(score) {
				const mod = Math.floor((score - 10) / 2);
				return (mod >= 0 ? "+" : "") + mod;
			}

			function translateCreatureText(creatureName) {
				const base = statblocks[creatureName];
				if (!base) return null;
				const t = creatureTranslations[creatureName];
				if (!t) return base;

				const s = Object.assign({}, base);
				s.name = creatureNamesFR[creatureName] || base.name;

				s.traits = base.traits.map((tr) => ({
					name: (t.traits && t.traits[tr.name]) || tr.name,
					entries: (t.traitEntries && t.traitEntries[tr.name]) || tr.entries,
				}));

				s.actions = base.actions.map((a) => ({
					name: (t.actions && t.actions[a.name]) || a.name,
					entries: (t.actionEntries && t.actionEntries[a.name]) || a.entries,
				}));

				if (base.reactions) {
					s.reactions = base.reactions.map((r) => ({
						name: (t.reactions && t.reactions[r.name]) || r.name,
						entries: (t.reactionEntries && t.reactionEntries[r.name]) || r.entries,
					}));
				}

				return s;
			}

			function renderStatblock(creatureName) {
				const translated = translateCreatureText(creatureName);
				const s = translated || statblocks[creatureName];
				if (!s) return `<div class="statblock"><p>Statblock non disponible: ${creatureName}</p></div>`;

				let speedStr = Object.entries(s.speed)
					.map(([k, v]) => {
						const label = speedMap[k] || k;
						return label + " " + (v * 0.3).toFixed(0) + " m (" + v + " ft.)";
					})
					.join(", ");

				let sensesArr = translateSenses(s.senses);
				let passivePerc = 10 + (parseInt((s.skills.perception || "+0").replace("+", "")) || 0);
				let sensesStr = sensesArr.length ? sensesArr.join(", ") + ", " : "";
				sensesStr += "Perception passive " + passivePerc;

				let langsStr = s.languages.length ? translateLanguages(s.languages).join(", ") : "—";
				let skillsStr = Object.entries(s.skills)
					.map(([k, v]) => (skillMap[k] || k) + " " + v)
					.join(", ");
				let savesStr = Object.entries(s.saves)
					.map(([k, v]) => (abMap[k] || k.toUpperCase()) + " " + v)
					.join(", ");

				let resistStr = "";
				if (s.damageResistances && s.damageResistances.length) {
					resistStr = s.damageResistances
						.map((r) => {
							if (r.startsWith("{")) {
								try {
									const obj = JSON.parse(r);
									return translateDmg(obj.resist).join(", ") + " (des attaques non magiques)";
								} catch (e) {
									return r;
								}
							}
							return dmgMap[r] || r;
						})
						.join("; ");
				}

				let immuneStr = "";
				if (s.damageImmunities && s.damageImmunities.length) {
					immuneStr = s.damageImmunities
						.map((r) => {
							if (r.startsWith("{")) {
								try {
									const obj = JSON.parse(r);
									return translateDmg(obj.immune).join(", ") + " (des attaques non magiques et non en argent)";
								} catch (e) {
									return r;
								}
							}
							return dmgMap[r] || r;
						})
						.join("; ");
				}

				let condImmuneStr = s.conditionImmunities.length ? s.conditionImmunities.map((c) => condMap[c] || c).join(", ") : "";

				let sizeStr = sizeMap[s.size] || s.size;
				let typeStr = typeMap[s.type] || s.type;
				let alignStr = alignMap[s.alignment] || s.alignment;

				let html = `<div class="statblock">`;
				html += `<div class="name">${s.name}</div>`;
				html += `<div class="type-line">${sizeStr} ${typeStr}, ${alignStr}</div>`;
				html += `<hr class="separator">`;
				html += `<div class="stat-row"><span class="label">Classe d'armure</span> ${s.ac}${s.acType ? " (" + translateArmor(s.acType) + ")" : ""}</div>`;
				html += `<div class="stat-row"><span class="label">Points de vie</span> ${s.hp} (${s.hpFormula})</div>`;
				html += `<div class="stat-row"><span class="label">Vitesse</span> ${speedStr}</div>`;
				html += `<hr class="separator">`;

				html += `<div class="abilities">`;
				["str", "dex", "con", "int", "wis", "cha"].forEach((ab) => {
					html += `<div><div class="ab-label">${abMap[ab]}</div><div class="ab-val">${s[ab]} (${formatMod(s[ab])})</div></div>`;
				});
				html += `</div>`;
				html += `<hr class="separator">`;

				if (savesStr) html += `<div class="stat-row"><span class="label">Jets de sauvegarde</span> ${savesStr}</div>`;
				if (skillsStr) html += `<div class="stat-row"><span class="label">Compétences</span> ${skillsStr}</div>`;
				if (resistStr) html += `<div class="stat-row"><span class="label">Résistances aux dégâts</span> ${resistStr}</div>`;
				if (immuneStr) html += `<div class="stat-row"><span class="label">Immunités aux dégâts</span> ${immuneStr}</div>`;
				if (condImmuneStr) html += `<div class="stat-row"><span class="label">Immunités aux états</span> ${condImmuneStr}</div>`;
				html += `<div class="stat-row"><span class="label">Sens</span> ${sensesStr}</div>`;
				html += `<div class="stat-row"><span class="label">Langues</span> ${langsStr}</div>`;
				html += `<div class="stat-row"><span class="label">Facteur de puissance</span> ${s.cr}</div>`;

				if (s.traits.length) {
					html += `<hr class="separator">`;
					s.traits.forEach((t) => {
						html += `<div class="trait"><span class="trait-name">${t.name}.</span> ${t.entries}</div>`;
					});
				}

				if (s.actions.length) {
					html += `<div class="section-title">Actions</div>`;
					s.actions.forEach((a) => {
						html += `<div class="trait"><span class="trait-name">${a.name}.</span> ${a.entries}</div>`;
					});
				}

				if (s.reactions && s.reactions.length) {
					html += `<div class="section-title">Réactions</div>`;
					s.reactions.forEach((r) => {
						html += `<div class="trait"><span class="trait-name">${r.name}.</span> ${r.entries}</div>`;
					});
				}

				html += `</div>`;
				return html;
			}

			function avgDice(formula) {
				const m = formula.match(/^(\d+)d(\d+)$/);
				if (!m) return parseInt(formula) || 1;
				return Math.ceil((parseInt(m[1]) * (parseInt(m[2]) + 1)) / 2);
			}

			function scaleCount(baseFormula, level) {
				const factor = countScaleByLevel[level] || 1;
				const m = baseFormula.match(/^(\d+)d(\d+)$/);
				if (!m) {
					// Formule fixe ("1", "2", etc.)
					return String(Math.max(1, Math.round(parseInt(baseFormula) * factor)));
				}
				const [, num, sides] = m;
				const scaled = Math.max(1, Math.round(parseInt(num) * factor));
				return `${scaled}d${sides}`;
			}

			function encMultiplier(count) {
				if (count === 1) return 1;
				if (count === 2) return 1.5;
				if (count <= 6) return 2;
				if (count <= 10) return 2.5;
				if (count <= 14) return 3;
				return 4;
			}

			function computeXP(enc, scaledFormula) {
				const avg = avgDice(scaledFormula);
				const xpPerMonster = xpByCR[enc.cr] ?? 0;
				return Math.round(xpPerMonster * avg * encMultiplier(avg));
			}

			function computeDiff(xp, players, level) {
				const t = xpThresholds[level] || xpThresholds[4];
				if (xp <= t.easy * players) return "easy";
				if (xp <= t.medium * players) return "medium";
				if (xp <= t.hard * players) return "hard";
				return "deadly";
			}

			function rollDice(formula) {
				const m = formula.match(/^(\d+)d(\d+)$/);
				if (!m) return parseInt(formula) || 1;
				const [, count, sides] = m;
				let total = 0;
				for (let i = 0; i < parseInt(count); i++) {
					total += Math.floor(Math.random() * parseInt(sides)) + 1;
				}
				return total;
			}

			// État courant du groupe
			let currentPlayers = 4;
			let currentLevel = 4;
			// Table triée avec counts/diffs calculés
			let sortedEncounters = [];

			function buildSortedEncounters(players, level) {
				// Calculer le count scalé et l'XP pour chaque encounter
				const computed = encounters.map((enc) => {
					const scaledCount = scaleCount(enc.count, level);
					const xp = computeXP(enc, scaledCount);
					return { enc, scaledCount, xp };
				});

				// Trier par XP croissant
				computed.sort((a, b) => a.xp - b.xp);

				// Assigner les rangs et difficulté
				return computed.map((item, idx) => {
					let diff;
					if (idx < 30) diff = "easy";
					else if (idx < 80) diff = "medium";
					else diff = computeDiff(item.xp, players, level) === "deadly" ? "deadly" : "hard";

					return {
						...item.enc,
						rank: idx + 1,
						currentCount: item.scaledCount,
						currentDiff: diff,
						currentXP: item.xp,
					};
				});
			}

			function rebuildTable(players, level) {
				currentPlayers = players;
				currentLevel = level;
				sortedEncounters = buildSortedEncounters(players, level);

				const tbody = document.getElementById("tableBody");
				tbody.innerHTML = "";

				// Stats de difficulté
				const counts = { easy: 0, medium: 0, hard: 0, deadly: 0 };
				sortedEncounters.forEach((enc) => counts[enc.currentDiff]++);
				const statsEl = document.getElementById("diffStats");
				if (statsEl) {
					statsEl.innerHTML = `<span class="diff-easy">${counts.easy} easy</span> / ` + `<span class="diff-medium">${counts.medium} medium</span> / ` + `<span class="diff-hard">${counts.hard} hard</span>` + (counts.deadly ? ` / <span class="diff-deadly">${counts.deadly} deadly</span>` : "");
				}

				sortedEncounters.forEach((enc) => {
					const tr = document.createElement("tr");
					tr.className = enc.currentDiff;
					tr.dataset.rank = enc.rank;
					tr.innerHTML = "<td>" + String(enc.rank).padStart(2, "0") + "</td>" + "<td><b>" + enc.name + "</b></td>" + "<td>" + enc.currentCount + "</td>" + '<td><span class="tag tag-' + enc.type + '">' + enc.type + "</span></td>" + "<td>" + enc.cr + "</td>" + '<td><span class="tag tag-' + enc.currentDiff + '">' + enc.currentDiff.toUpperCase() + "</span></td>" + "<td>" + enc.desc + "</td>";
					tr.addEventListener("click", () => selectEncounter(enc.rank));
					tbody.appendChild(tr);
				});
			}

			function selectEncounter(rank) {
				const enc = sortedEncounters.find((e) => e.rank === rank);
				if (!enc) return;
				const card = document.getElementById("resultCard");
				const count = rollDice(enc.currentCount);
				const diffClass = "diff-" + enc.currentDiff;

				document.getElementById("resultRoll").textContent = "d100 : " + rank;
				document.getElementById("resultEncounter").innerHTML = `<span class="${diffClass}">${count}</span> × ${enc.name}`;
				document.getElementById("resultDesc").textContent = enc.desc;
				document.getElementById("resultMeta").innerHTML = `<span><b>Type :</b> <span class="tag tag-${enc.type}">${enc.type}</span></span>` + `<span><b>CR :</b> ${enc.cr}</span>` + `<span><b>Difficulté :</b> <span class="${diffClass}">${enc.currentDiff.toUpperCase()}</span></span>` + `<span><b>XP :</b> ${enc.currentXP}</span>`;

				const container = document.getElementById("statblockContainer");
				const uniqueCreatures = [...new Set(enc.creatures)];
				container.innerHTML = uniqueCreatures.map((c) => renderStatblock(c)).join("");

				document.querySelectorAll("#tableBody tr").forEach((r) => r.classList.remove("selected"));
				document.querySelectorAll("#tableBody tr").forEach((r) => {
					if (parseInt(r.dataset.rank) === rank) r.classList.add("selected");
				});

				card.className = "result-card show";
				card.scrollIntoView({ behavior: "smooth", block: "start" });
			}

			function rollD100() {
				const roll = Math.floor(Math.random() * 100) + 1;
				selectEncounter(roll);
			}

			// Init
			rebuildTable(currentPlayers, currentLevel);
		</script>
	</body>
</html>
